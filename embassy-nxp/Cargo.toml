[package]
name = "embassy-nxp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

publish = false

[package.metadata.embassy]
build = [
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "lpc55-core0"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "lpc55s16"]},
    {target = "thumbv7em-none-eabihf", features = ["defmt", "mimxrt1011", "rt", "time-driver-pit"]},
    {target = "thumbv7em-none-eabihf", features = ["defmt", "mimxrt1062", "rt", "time-driver-pit"]},
    {target = "thumbv6m-none-eabi", features = ["defmt", "mkl82z7", "rt", "time-driver-tpm"]},
    {target = "thumbv6m-none-eabi", features = ["defmt", "mkl82z7", "rt", "time-driver-tpm", "executor-thread"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-nxp-v$VERSION/embassy-nxp/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-nxp/src/"
features = ["defmt", "unstable-pac" ] # TODO: Add time-driver-any, as both lpc55 and mimxrt1xxx use different drivers.

flavors = [
    { regex_feature = "lpc55-core0", target = "thumbv8m.main-none-eabihf" },
    { regex_feature = "lpc55s16", target = "thumbv8m.main-none-eabihf" },
    { regex_feature = "mimxrt.*", target = "thumbv7em-none-eabihf" },
    { regex_feature = "mkl82z7", target = "thumbv6m-none-eabi" },
]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.0"
critical-section = "1.1.2"
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-2"] }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures"}
embassy-executor = { version = "0.10.0", path = "../embassy-executor", optional = true }
defmt = { version = "1", optional = true }
log = { version = "0.4.27", optional = true }
embassy-time = { version = "0.5.1", path = "../embassy-time", optional = true }
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", optional = true }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils", optional = true }
embedded-io = { version = "0.7.1" }
embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
## Chip dependencies
nxp-pac = { version = "0.1.0", optional = true, git = "https://github.com/sindrehan/nxp-pac", rev = "9385591565a67d7cb5395be97260333a3353be1f" }

imxrt-rt = { version = "0.1.7", optional = true, features = ["device"] }

[build-dependencies]
cfg_aliases = "0.2.1"
nxp-pac = { version = "0.1.0", git = "https://github.com/sindrehan/nxp-pac", rev = "9385591565a67d7cb5395be97260333a3353be1f", default-features = false, features = ["metadata"] }
proc-macro2 = "1.0.95"
quote = "1.0.15"

[features]
default = ["rt"]
# Enable PACs as optional dependencies, since some chip families will use different pac crates (temporarily).
rt = ["nxp-pac?/rt"]

## Enable [defmt support](https://docs.rs/defmt) and enables `defmt` debug-log messages and formatting in embassy drivers.
defmt = ["dep:defmt", "embassy-hal-internal/defmt", "embassy-sync/defmt"]

log = ["dep:log"]

## Enable the Kinetis thread-mode executor with low-power sleep support.
executor-thread = ["dep:embassy-executor"]

## Use Periodic Interrupt Timer (PIT) as the time driver for `embassy-time`, with a tick rate of 1 MHz
time-driver-pit = ["_time_driver", "embassy-time?/tick-hz-1_000_000"]

## Use Real Time Clock (RTC) as the time driver for `embassy-time`, with a tick rate of 32768 Hz
time-driver-rtc = ["_time_driver", "embassy-time?/tick-hz-32_768"]

## Use TPM2 as the time driver for `embassy-time`, with a tick rate of 1 MHz (Kinetis)
time-driver-tpm = ["_time_driver", "embassy-time?/tick-hz-1_000_000"]

## Reexport the PAC for the currently enabled chip at `embassy_nxp::pac` (unstable)
unstable-pac = []
# This is unstable because semver-minor (non-breaking) releases of embassy-nxp may major-bump (breaking) the PAC version.
# If this is an issue for you, you're encouraged to directly depend on a fixed version of the PAC.
# There are no plans to make this stable.

## internal use only
#
# This feature is unfortunately a hack around the fact that cfg_aliases cannot apply to the buildscript
# that creates the aliases.
_rt1xxx = []
_lpc55 = []
_kinetis = []

# A timer driver is enabled.
_time_driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

#! ### Chip selection features
lpc55-core0 = ["nxp-pac/lpc55s69_cm33_core0", "_lpc55"]
lpc55s16 = ["nxp-pac/lpc55s16", "_lpc55"]
mimxrt1011 = ["nxp-pac/mimxrt1011", "_rt1xxx", "dep:imxrt-rt"]
mimxrt1062 = ["nxp-pac/mimxrt1062", "_rt1xxx", "dep:imxrt-rt"]
mkl82z7 = ["nxp-pac/mkl82z7", "_kinetis"]
