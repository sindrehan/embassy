[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# The FRDM-KL82Z OpenSDA probe can run J-Link-compatible firmware.
runner = "probe-rs run --chip MKL82Z128VLK7 --protocol swd --connect-under-reset"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "debug"
