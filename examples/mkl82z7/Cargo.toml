[package]
name = "embassy-nxp-mkl82z7-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-nxp = { version = "0.1.0", path = "../../embassy-nxp", features = ["defmt", "mkl82z7", "unstable-pac"] }

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
debug = 2
lto = true
opt-level = "s"

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mkl82z7" }
]
