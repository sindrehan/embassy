[package]
name = "embassy-nxp-mkl82z7-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-nxp = { version = "0.1.0", path = "../../embassy-nxp", features = ["defmt", "mkl82z7", "unstable-pac", "time-driver-tpm"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "tick-hz-1_000_000"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
heapless = "0.8"

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
debug = 2
lto = true
opt-level = "s"

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/mkl82z7" }
]
